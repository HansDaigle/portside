[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portside-local"
version = "0.1.0"
description = "Remote destinations. Local ports. A Caddy-powered dashboard and CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "tomli-w>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[project.scripts]
portside = "portside.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portside"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
